@{layout('')}
@{title(CONF.name)}

<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=10" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
	<meta name="robots" content="all,follow" />
	<link href="@{'%cdn'}/spa.min@20.css" rel="stylesheet" />
	<script src="@{'%cdn'}/spa.min@20.js"></script>
	<script src="@{REPO.ui}"></script>
	@{import('meta', 'head', 'favicon.ico')}
	<style>
		:root {
			--radius: 5px;
			--color: @{CONF.color};
		}
		body { background-color: #F2F5FE; background: radial-gradient(circle at 12% 20%, rgba(241, 75, 54, 0.12), transparent 28%), radial-gradient(circle at 82% 8%, rgba(255, 122, 61, 0.15), transparent 32%), radial-gradient(circle at 52% 70%, rgba(255, 255, 255, 0.04), transparent 40%), #F2F5FE; min-height: 100vh; }
		body::before { content: ""; position: fixed; inset: 0; background-image: linear-gradient(rgba(0, 0, 0, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 0, 0, 0.1) 1px, transparent 1px); background-size: 82px 82px; opacity: 0.18; pointer-events: none; z-index: 0; }
		.login { max-width: 300px; text-align: left; margin: 0 auto; width: 100%; z-index: 5; position: relative; }
		.login > div { background-color: #FFF; padding: 30px; border-radius: var(--radius); box-shadow: 0 0 20px rgba(0,0,0,0.1); }
		footer { font-size: 11px; color: #999; text-align: center; padding: 0 0 10px; }
		footer a { color: #777; }
		h1 { font-size: 20px; margin: 0 0 15px 0; padding: 0; }
		h1 i { margin-right: 8px; font-size: 30px; vertical-align: middle; }
		h2 { font-size: 16px; margin: 0 0 15px 0; padding: 0; font-weight: normal; color: #777; }
		button { width: 100%; border: 0; padding: 8px 10px; font-size: 14px; background-color: var(--color); color: #FFF; border-radius: var(--radius); font-weight: bold; outline: 0; }
		button.fill { background-color: #f0eac2; color: #777; font-weight: normal; font-size: 11px; border: 1px solid rgba(0,0,0,0.05); padding: 3px 10px; }
		button:hover { opacity: 0.8; }
		button:disabled { background-color: #E0E0E0 !important; color: #999 !important; opacity: 1 !important; }
		.error { padding: 5px 0; color: red; }
		.alert { background-color: #fffad7; border: 1px solid #EDE8C8; padding: 15px; border-radius: var(--radius); color: #988e56; font-size: 12px; line-height: 14px; }
		.alert i { margin-right: 5px; }
		.kv { line-height: 17px; font-size: 12px; color: black; }
		.kv .value { margin-left: 85px; text-align: right; }
		.kv .key { float: left; width: 100px; }
		.kv > * { text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
	</style>
</head>
<body>

	<ui-component name="exec"></ui-component>

	<ui-component name="viewbox" config="centered:1;parent:window" class="invisible">
		<ui-plugin path="signinform" class="login">
			<div>
				<ui-component name="autofill">

					<div class="caption">
						<label>@{CONF.name}</label>
					</div>
					<br />

					@{if MAIN.admin.user.raw}
					<div class="alert" style="margin-bottom:20px">
						<div><i class="ti ti-user"></i>@(Default account:)</div>
						<div class="kv" style="margin-top:10px">
							<div class="key">@(User name)</div>
							<div class="value b monospace">@{MAIN.admin.user.login}</div>
						</div>
						<div class="kv">
							<div class="key">@(Password)</div>
							<div class="value b monospace">@{MAIN.admin.user.raw}</div>
						</div>
						<button name="submit" class="button exec mt10 fill" data-exec="?/fill"><i class="ti ti-copy"></i>@(Fill in the form)</button>
					</div>
					@{fi}

					<ui-component name="enter" path="?">
						<ui-component name="input" path="?.login" config="required:1;autofocus:1;autofill:1" default="''" class="m">@(User name)</ui-component>
						<ui-component name="input" path="?.password" config="required:1;type:password;autofill:1" default="''" class="m">@(Password)</ui-component>
						<ui-bind path="%error" config="show;template" class="error">
							<script type="text/html">
								<i class="ti ti-exclamation-triangle"></i> {{ value }}
							</script>
						</ui-bind>
						<ui-component name="validate" path="?" style="margin-top:20px">
							<button name="submit" class="button exec" data-exec="?/submit" disabled>@(Sign in)</button>
						</ui-component>
					</ui-component>

				</ui-component>
			</div>
			<br />
			<footer><a href="https://www.totaljs.com" target="_blank">@(Powered by <b>Total.js Platform</b>)</a><br />&copy; 2015-2026</footer>
		</ui-plugin>
	</ui-component>

	<script>

		DEF.api = '@{CONF.$api}';

		PLUGIN('signinform', function(exports) {

			exports.submit = function() {
				exports.tapi('Admin|login', exports.form, ERROR(function(response) {
					location.href = (DEF.api === '/api/' ? '/' : DEF.api) + ($('.alert').length ? '?welcome=1' : '');
				}, function(response) {
					SET('%error', response[0].error);
				}));
			};

			exports.fill = function() {
				SET('signinform @change', { login: '@{MAIN.admin.user.login}', password: '@{MAIN.admin.user.raw}' });
			};
		});

	</script>

</body>
</html>
